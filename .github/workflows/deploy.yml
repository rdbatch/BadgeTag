name: Deploy
run-name: "Deploy - ${{ inputs.environment }}"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - prod
      region:
        description: AWS region to deploy into
        type: choice
        required: true
        default: us-east-2
        options:
          - us-east-2
      branch:
        description: Branch to deploy (uses latest successful build from this branch)
        type: string
        required: true
        default: main

permissions:
  id-token: write # required for OIDC -> AWS credential exchange
  contents: read
  actions: read # required to fetch the Build workflow's artifact

env:
  ENVIRONMENT: ${{ inputs.environment }}
  REGION: ${{ inputs.region }}

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04-arm
    # Maps to a GitHub Environment of the same name, which holds the
    # per-environment AWS_ACCOUNT_ID, OIDC role ARN, and can enforce
    # required reviewers (recommended for `prod`).
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-session-name: gha-badgetag-deploy-${{ inputs.environment }}

      - name: Verify caller is in the expected account
        run: |
          CALLER_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED_ACCOUNT="${{ vars.AWS_ACCOUNT_ID }}"
          if [[ "$CALLER_ACCOUNT" != "$EXPECTED_ACCOUNT" ]]; then
            echo "::error::Assumed role resolved to account $CALLER_ACCOUNT, expected $EXPECTED_ACCOUNT for environment '$ENVIRONMENT'." >&2
            exit 1
          fi
          echo "Authenticated in account $CALLER_ACCOUNT for environment '$ENVIRONMENT'"

      - name: Download Lambda binaries from latest successful Build run
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build.yml
          branch: ${{ inputs.branch }}
          name: lambda-binaries
          path: backend/target/lambda
          workflow_conclusion: success

      # upload-artifact/download-artifact don't preserve the executable
      # bit, so it must be restored before CDK zips these up as assets.
      - name: Restore executable bit on Lambda bootstrap binaries
        run: chmod +x backend/target/lambda/*/bootstrap

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Fill in og:image absolute URL
        working-directory: frontend
        # index.html's og:image/twitter:image use a __SITE_URL__ placeholder
        # (see comment in frontend/index.html) since the build itself is
        # environment-agnostic — fill it in now that we know this deploy's
        # domain.
        run: sed -i.bak "s#__SITE_URL__#https://${{ vars.DOMAIN_NAME }}#g" dist/index.html && rm -f dist/index.html.bak

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Deploy backend stacks (Data, Auth, Api, Rum, Waf)
        working-directory: infra
        # Waf is deployed here (not with Frontend below) because
        # FrontendStack references its Web ACL ARN directly (via
        # crossRegionReferences — see infra/bin/app.ts) rather than
        # through SSM, so it must already exist before Frontend's
        # `--exclusively` deploy runs. Rum is deployed here (not with
        # Monitoring, which owns its dashboard widgets) because its app
        # monitor/identity pool IDs are AWS-generated and must exist before
        # the "Write runtime config.json" step below can read them from
        # cdk-outputs.json — see rum-stack.ts's doc comment.
        run: |
          npx cdk deploy \
            "BadgeTag-Data-${ENVIRONMENT}" \
            "BadgeTag-Auth-${ENVIRONMENT}" \
            "BadgeTag-Api-${ENVIRONMENT}" \
            "BadgeTag-Rum-${ENVIRONMENT}" \
            "BadgeTag-Waf-${ENVIRONMENT}" \
            --context environment="$ENVIRONMENT" \
            --context region="$REGION" \
            --context account="${{ vars.AWS_ACCOUNT_ID }}" \
            --context "domainName=${{ vars.DOMAIN_NAME }}" \
            --context "certificateArn=${{ vars.CERTIFICATE_ARN }}" \
            --context "alertEmail=${{ vars.ALERT_EMAIL }}" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Write runtime config.json
        working-directory: infra
        run: |
          USER_POOL_ID=$(jq -r ".\"BadgeTag-Auth-${ENVIRONMENT}\".UserPoolId" cdk-outputs.json)
          USER_POOL_CLIENT_ID=$(jq -r ".\"BadgeTag-Auth-${ENVIRONMENT}\".UserPoolClientId" cdk-outputs.json)
          RUM_APP_MONITOR_ID=$(jq -r ".\"BadgeTag-Rum-${ENVIRONMENT}\".RumAppMonitorId" cdk-outputs.json)
          # No guest role ARN: the browser resolves it from the identity
          # pool's role attachment via RUM's enhanced credential flow —
          # see monitoring/rum.ts.
          RUM_IDENTITY_POOL_ID=$(jq -r ".\"BadgeTag-Rum-${ENVIRONMENT}\".RumIdentityPoolId" cdk-outputs.json)

          cat > ../frontend/dist/config.json <<EOF
          {
            "region": "${REGION}",
            "userPoolId": "${USER_POOL_ID}",
            "userPoolClientId": "${USER_POOL_CLIENT_ID}",
            "apiBase": "",
            "rumAppMonitorId": "${RUM_APP_MONITOR_ID}",
            "rumIdentityPoolId": "${RUM_IDENTITY_POOL_ID}"
          }
          EOF

      - name: Deploy frontend stack
        working-directory: infra
        run: |
          npx cdk deploy \
            "BadgeTag-Frontend-${ENVIRONMENT}" \
            --exclusively \
            --context environment="$ENVIRONMENT" \
            --context region="$REGION" \
            --context account="${{ vars.AWS_ACCOUNT_ID }}" \
            --context "domainName=${{ vars.DOMAIN_NAME }}" \
            --context "certificateArn=${{ vars.CERTIFICATE_ARN }}" \
            --context "alertEmail=${{ vars.ALERT_EMAIL }}" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Deploy monitoring stack
        working-directory: infra
        # Must run after Api and Frontend — it resolves their SSM-published
        # identifiers (function name, log group, distribution id, etc.) to
        # build its dashboard widgets. See infra/lib/monitoring-stack.ts.
        # domainName/certificateArn are required here too, even though
        # MonitoringStack itself doesn't use them — bin/app.ts always
        # constructs every stack (AuthStack's passkey relying party ID,
        # FrontendStack's custom domain) before CDK filters down to the
        # `--exclusively` target.
        run: |
          npx cdk deploy \
            "BadgeTag-Monitoring-${ENVIRONMENT}" \
            --exclusively \
            --context environment="$ENVIRONMENT" \
            --context region="$REGION" \
            --context account="${{ vars.AWS_ACCOUNT_ID }}" \
            --context "domainName=${{ vars.DOMAIN_NAME }}" \
            --context "certificateArn=${{ vars.CERTIFICATE_ARN }}" \
            --context "alertEmail=${{ vars.ALERT_EMAIL }}" \
            --require-approval never

      - name: Summary
        working-directory: infra
        run: |
          SITE_URL=$(jq -r ".\"BadgeTag-Frontend-${ENVIRONMENT}\".DistributionUrl" cdk-outputs.json)
          echo "### Deployment complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Region:** ${REGION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
